  schemas:

    Heartbeat:
      type: object
      required: [serviceId, timestamp]
      properties:
        serviceId:
          type: string
          const: planning
        timestamp:
          type: string
          format: date-time

    SessionCreated:
      type: object
      required: [title, date, startTime, endTime]
      properties:
        sessionId:
          type: string
          format: uuid
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        location:
          type: string
        locationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, cancelled, full, concept]
        capacity:
          type: integer
          minimum: 1
        icsData:
          type: string
          description: Base64 encoded ICS kalenderbestand
        timestamp:
          type: string
          format: date-time

    FrontendSessionCreated:
      type: object
      required: [title, date, startTime, endTime, capacity]
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        capacity:
          type: integer
          minimum: 1
        locationId:
          type: string
          format: uuid

    FrontendSessionUpdated:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        capacity:
          type: integer
          minimum: 1
        locationId:
          type: string
          format: uuid

    FrontendSessionCancelled:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
        reason:
          type: string

    SessionsRequested:
      type: object
      properties: {}

    SessionUpdated:
      type: object
      required: [sessionId, sessionName, changeType, timestamp]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: string
        changeType:
          type: string
          enum: [rescheduled, cancelled, updated]
        newTime:
          type: string
          format: date-time
        newLocation:
          type: string
        participantIds:
          type: array
          items:
            type: string
            format: uuid
        icsData:
          type: string
        timestamp:
          type: string
          format: date-time

    SessionCancelled:
      type: object
      required: [sessionId, sessionName]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: string
        status:
          type: string
        reason:
          type: string
        participantIds:
          type: array
          items:
            type: string
            format: uuid
        icsData:
          type: string
        timestamp:
          type: string
          format: date-time

    SessionRescheduled:
      type: object
      required: [sessionId, sessionName, oldDate, oldStartTime, newDate, newStartTime]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: string
        oldDate:
          type: string
          format: date
        oldStartTime:
          type: string
          format: time
        oldEndTime:
          type: string
          format: time
        newDate:
          type: string
          format: date
        newStartTime:
          type: string
          format: time
        newEndTime:
          type: string
          format: time
        newLocation:
          type: string
        reason:
          type: string
        icsData:
          type: string
        timestamp:
          type: string
          format: date-time

    SessionFull:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
        currentRegistrations:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 1
        crmMasterId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    SessionError:
      type: object
      required: [errorType, message, service, timestamp]
      properties:
        errorType:
          type: string
          enum: [VALIDATION_ERROR, OUTLOOK_SYNC_FAILED, DATABASE_ERROR, RABBITMQ_ERROR, CONFLICT_ERROR, NOT_FOUND, IDEMPOTENCY_VIOLATION, UNKNOWN_ERROR]
        message:
          type: string
        sessionId:
          type: string
          format: uuid
        service:
          type: string
