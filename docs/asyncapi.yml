asyncapi: 3.1.0

info:
  title: Planning Service
  version: 1.7.0
  description: |
    AsyncAPI documentatie voor de Planning Service — Integratieproject 2026 Groep 2.
    De Planning Service beheert sessies, locaties, sprekers en inschrijvingen voor events.
    Communicatie verloopt via RabbitMQ met XML berichten gevalideerd tegen de XSD schema bestanden.
  contact:
    name: Hana (Team Lead)

defaultContentType: application/xml

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ broker — lokaal via Docker
    security:
      - $ref: '#/components/securitySchemes/rabbitmqAuth'

channels:

  # ── PLANNING → CONTROL ROOM ─────────────────────────────────────────
  planning.heartbeat:
    address: routing.heartbeat
    description: |
      Heartbeat van de Planning Service — elke seconde verstuurd.
      Control Room gebruikt dit om de status van de service te monitoren.
    messages:
      HeartbeatMessage:
        $ref: '#/components/messages/Heartbeat'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: heartbeat.direct
          type: direct
          durable: true

  # ── PLANNING → ALLE TEAMS via planning.topic ─────────────────────────
  planning.session.created:
    address: planning.session.created
    description: |
      Verstuurd wanneer een nieuwe sessie aangemaakt wordt.
      Frontend en Control Room ontvangen dit event.
    messages:
      SessionCreatedMessage:
        $ref: '#/components/messages/SessionCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.session.updated:
    address: planning.session.updated
    description: |
      Verstuurd wanneer een sessie gewijzigd wordt.
      CRM, Frontend en Mailing ontvangen dit event via planning.topic.
    messages:
      SessionUpdatedMessage:
        $ref: '#/components/messages/SessionUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.session.cancelled:
    address: planning.session.cancelled
    description: |
      Verstuurd wanneer een sessie geannuleerd wordt.
      Frontend, Mailing en Control Room ontvangen dit event.
    messages:
      SessionCancelledMessage:
        $ref: '#/components/messages/SessionCancelled'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.session.rescheduled:
    address: planning.session.rescheduled
    description: |
      Verstuurd wanneer een sessie verzet wordt naar een ander tijdslot.
      Bevat altijd old én new tijdslot. SessionChangeLog wordt aangemaakt.
    messages:
      SessionRescheduledMessage:
        $ref: '#/components/messages/SessionRescheduled'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.session.full:
    address: planning.session.full
    description: |
      Verstuurd wanneer een sessie volzet is.
      Frontend en Mailing ontvangen dit event.
    messages:
      SessionFullMessage:
        $ref: '#/components/messages/SessionFull'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.session.error:
    address: planning.session.error
    description: |
      Verstuurd bij elke fout in de Planning Service.
      Control Room logt de fout en verwittigt admins.
    messages:
      SessionErrorMessage:
        $ref: '#/components/messages/SessionError'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.participant.registered:
    address: planning.participant.registered
    description: |
      Verstuurd wanneer een deelnemer zich inschrijft voor een sessie.
      Control Room updatet statistieken.
    messages:
      ParticipantRegisteredMessage:
        $ref: '#/components/messages/ParticipantRegistered'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.registration.confirmed:
    address: planning.registration.confirmed
    description: |
      Verstuurd naar Frontend als bevestiging dat een registratie succesvol is verwerkt.
    messages:
      RegistrationConfirmedMessage:
        $ref: '#/components/messages/RegistrationConfirmed'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  # ── PLANNING → FRONTEND (locaties en sprekers) ───────────────────────
  planning.location.created:
    address: planning.location.created
    description: Planning stuurt bevestiging naar Frontend na aanmaken locatie.
    messages:
      LocationCreatedMessage:
        $ref: '#/components/messages/LocationCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.location.updated:
    address: planning.location.updated
    description: Planning stuurt locatie update naar Frontend.
    messages:
      LocationUpdatedMessage:
        $ref: '#/components/messages/LocationUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.location.deleted:
    address: planning.location.deleted
    description: Planning stuurt locatie verwijdering naar Frontend.
    messages:
      LocationDeletedMessage:
        $ref: '#/components/messages/LocationDeleted'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.speaker.created:
    address: planning.speaker.created
    description: Planning stuurt bevestiging naar Frontend na aanmaken spreker.
    messages:
      SpeakerCreatedMessage:
        $ref: '#/components/messages/SpeakerCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.speaker.updated:
    address: planning.speaker.updated
    description: Planning stuurt spreker update naar Frontend.
    messages:
      SpeakerUpdatedMessage:
        $ref: '#/components/messages/SpeakerUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  planning.speaker.deactivated:
    address: planning.speaker.deactivated
    description: Planning stuurt spreker deactivatie naar Frontend.
    messages:
      SpeakerDeactivatedMessage:
        $ref: '#/components/messages/SpeakerDeactivated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: planning.topic
          type: topic
          durable: true

  # ── PLANNING → CRM (user sync via user.topic) ───────────────────────
  planning.user.created:
    address: planning.user.created
    description: |
      Verstuurd wanneer een spreker aangemaakt wordt in Planning.
      CRM maakt een Contact aan in Salesforce en stuurt crm.user.confirmed terug.
    messages:
      PlanningUserCreatedMessage:
        $ref: '#/components/messages/PlanningUserCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.topic
          type: topic
          durable: true

  planning.user.updated:
    address: planning.user.updated
    description: |
      Verstuurd wanneer een spreker gewijzigd wordt in Planning.
      CRM updatet het Contact in Salesforce.
    messages:
      PlanningUserUpdatedMessage:
        $ref: '#/components/messages/PlanningUserUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.topic
          type: topic
          durable: true

  planning.user.deactivated:
    address: planning.user.deactivated
    description: |
      Verstuurd wanneer een spreker gedeactiveerd wordt in Planning.
      CRM zet isActive op false in Salesforce.
    messages:
      PlanningUserDeactivatedMessage:
        $ref: '#/components/messages/PlanningUserDeactivated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.topic
          type: topic
          durable: true

  # ── FRONTEND → PLANNING (via frontend.topic) ─────────────────────────
  frontend.location.created:
    address: planning.location.created
    description: Frontend stuurt verzoek naar Planning om een locatie aan te maken.
    messages:
      FrontendLocationCreatedMessage:
        $ref: '#/components/messages/LocationCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.location.updated:
    address: planning.location.updated
    description: Frontend stuurt verzoek naar Planning om een locatie te wijzigen.
    messages:
      FrontendLocationUpdatedMessage:
        $ref: '#/components/messages/LocationUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.location.deleted:
    address: planning.location.deleted
    description: Frontend stuurt verzoek naar Planning om een locatie te verwijderen.
    messages:
      FrontendLocationDeletedMessage:
        $ref: '#/components/messages/LocationDeleted'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.locations.requested:
    address: planning.locations.requested
    description: Frontend vraagt alle locaties op via request-reply.
    messages:
      LocationsRequestedMessage:
        $ref: '#/components/messages/LocationsRequested'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.speaker.created:
    address: planning.speaker.created
    description: Frontend stuurt verzoek naar Planning om een spreker aan te maken.
    messages:
      FrontendSpeakerCreatedMessage:
        $ref: '#/components/messages/SpeakerCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.speaker.updated:
    address: planning.speaker.updated
    description: Frontend stuurt verzoek naar Planning om een spreker te wijzigen.
    messages:
      FrontendSpeakerUpdatedMessage:
        $ref: '#/components/messages/SpeakerUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.speaker.deactivated:
    address: planning.speaker.deactivated
    description: Frontend stuurt verzoek naar Planning om een spreker te deactiveren.
    messages:
      FrontendSpeakerDeactivatedMessage:
        $ref: '#/components/messages/SpeakerDeactivated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.speakers.requested:
    address: planning.speakers.requested
    description: Frontend vraagt alle sprekers op via request-reply.
    messages:
      SpeakersRequestedMessage:
        $ref: '#/components/messages/SpeakersRequested'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.session.created:
    address: planning.session.created
    description: Frontend stuurt verzoek naar Planning om een sessie aan te maken.
    messages:
      FrontendSessionCreatedMessage:
        $ref: '#/components/messages/FrontendSessionCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.session.updated:
    address: planning.session.updated
    description: Frontend stuurt verzoek naar Planning om een sessie te wijzigen.
    messages:
      FrontendSessionUpdatedMessage:
        $ref: '#/components/messages/FrontendSessionUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.session.cancelled:
    address: planning.session.cancelled
    description: Frontend stuurt verzoek naar Planning om een sessie te annuleren.
    messages:
      FrontendSessionCancelledMessage:
        $ref: '#/components/messages/FrontendSessionCancelled'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.sessions.requested:
    address: planning.sessions.requested
    description: Frontend vraagt alle sessies op via request-reply.
    messages:
      SessionsRequestedMessage:
        $ref: '#/components/messages/SessionsRequested'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  frontend.registration.created:
    address: planning.registration.created
    description: |
      Frontend stuurt registratieverzoek naar Planning.
      Bevat sessionId en crmMasterId van de bezoeker.
    messages:
      RegistrationCreatedMessage:
        $ref: '#/components/messages/RegistrationCreated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: frontend.topic
          type: topic
          durable: true

  # ── CRM → PLANNING (via contact.topic) ──────────────────────────────
  crm.user.confirmed:
    address: planning.user.confirmed
    description: |
      Planning luistert op deze queue.
      Als role=SPEAKER → opslaan in Speaker tabel.
      Als role=EVENT_MANAGER → crmMasterId opslaan bij User.
      Als role=VISITOR → crmMasterId opslaan bij Participant.
    messages:
      UserConfirmedMessage:
        $ref: '#/components/messages/UserConfirmed'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: contact.topic
          type: topic
          durable: true

  crm.user.updated:
    address: planning.user.updated
    description: |
      Planning luistert op deze queue.
      Als role=SPEAKER → Speaker tabel bijwerken op basis van crmMasterId.
    messages:
      UserUpdatedMessage:
        $ref: '#/components/messages/UserUpdated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: contact.topic
          type: topic
          durable: true

  crm.user.deactivated:
    address: planning.user.deactivated
    description: |
      Planning luistert op deze queue.
      isActive op false zetten in Speaker tabel op basis van id.
    messages:
      UserDeactivatedMessage:
        $ref: '#/components/messages/UserDeactivated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: contact.topic
          type: topic
          durable: true

operations:

  # ── PLANNING verstuurt ───────────────────────────────────────────────
  sendHeartbeat:
    action: send
    channel:
      $ref: '#/channels/planning.heartbeat'
    summary: Planning verstuurt elke seconde een heartbeat naar Control Room
    bindings:
      amqp:
        deliveryMode: 1

  sendSessionCreated:
    action: send
    channel:
      $ref: '#/channels/planning.session.created'
    summary: Planning verstuurt SessionCreated naar Frontend en Control Room

  sendSessionUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.session.updated'
    summary: Planning verstuurt SessionUpdated naar CRM, Frontend en Mailing via planning.topic

  sendSessionCancelled:
    action: send
    channel:
      $ref: '#/channels/planning.session.cancelled'
    summary: Planning verstuurt SessionCancelled naar Frontend, Mailing en Control Room

  sendSessionRescheduled:
    action: send
    channel:
      $ref: '#/channels/planning.session.rescheduled'
    summary: Planning verstuurt SessionRescheduled naar Frontend en Mailing

  sendSessionFull:
    action: send
    channel:
      $ref: '#/channels/planning.session.full'
    summary: Planning verstuurt SessionFull naar Frontend en Mailing

  sendSessionError:
    action: send
    channel:
      $ref: '#/channels/planning.session.error'
    summary: Planning verstuurt SessionError naar Control Room bij elke fout

  sendParticipantRegistered:
    action: send
    channel:
      $ref: '#/channels/planning.participant.registered'
    summary: Planning verstuurt ParticipantRegistered naar Control Room

  sendRegistrationConfirmed:
    action: send
    channel:
      $ref: '#/channels/planning.registration.confirmed'
    summary: Planning verstuurt RegistrationConfirmed naar Frontend als bevestiging

  sendLocationCreated:
    action: send
    channel:
      $ref: '#/channels/planning.location.created'
    summary: Planning verstuurt LocationCreated naar Frontend

  sendLocationUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.location.updated'
    summary: Planning verstuurt LocationUpdated naar Frontend

  sendLocationDeleted:
    action: send
    channel:
      $ref: '#/channels/planning.location.deleted'
    summary: Planning verstuurt LocationDeleted naar Frontend

  sendSpeakerCreated:
    action: send
    channel:
      $ref: '#/channels/planning.speaker.created'
    summary: Planning verstuurt SpeakerCreated naar Frontend

  sendSpeakerUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.speaker.updated'
    summary: Planning verstuurt SpeakerUpdated naar Frontend

  sendSpeakerDeactivated:
    action: send
    channel:
      $ref: '#/channels/planning.speaker.deactivated'
    summary: Planning verstuurt SpeakerDeactivated naar Frontend

  sendPlanningUserCreated:
    action: send
    channel:
      $ref: '#/channels/planning.user.created'
    summary: Planning verstuurt PlanningUserCreated naar CRM wanneer een spreker aangemaakt wordt

  sendPlanningUserUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.user.updated'
    summary: Planning verstuurt PlanningUserUpdated naar CRM wanneer een spreker gewijzigd wordt

  sendPlanningUserDeactivated:
    action: send
    channel:
      $ref: '#/channels/planning.user.deactivated'
    summary: Planning verstuurt PlanningUserDeactivated naar CRM wanneer een spreker gedeactiveerd wordt

  # ── PLANNING ontvangt van Frontend ───────────────────────────────────
  receiveFrontendLocationCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.location.created'
    summary: Planning ontvangt LocationCreated van Frontend — locatie aanmaken

  receiveFrontendLocationUpdated:
    action: receive
    channel:
      $ref: '#/channels/frontend.location.updated'
    summary: Planning ontvangt LocationUpdated van Frontend — locatie wijzigen

  receiveFrontendLocationDeleted:
    action: receive
    channel:
      $ref: '#/channels/frontend.location.deleted'
    summary: Planning ontvangt LocationDeleted van Frontend — locatie verwijderen

  receiveFrontendLocationsRequested:
    action: receive
    channel:
      $ref: '#/channels/frontend.locations.requested'
    summary: Planning ontvangt LocationsRequested van Frontend — alle locaties terugsturen

  receiveFrontendSpeakerCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.speaker.created'
    summary: Planning ontvangt SpeakerCreated van Frontend — spreker aanmaken

  receiveFrontendSpeakerUpdated:
    action: receive
    channel:
      $ref: '#/channels/frontend.speaker.updated'
    summary: Planning ontvangt SpeakerUpdated van Frontend — spreker wijzigen

  receiveFrontendSpeakerDeactivated:
    action: receive
    channel:
      $ref: '#/channels/frontend.speaker.deactivated'
    summary: Planning ontvangt SpeakerDeactivated van Frontend — spreker deactiveren

  receiveFrontendSpeakersRequested:
    action: receive
    channel:
      $ref: '#/channels/frontend.speakers.requested'
    summary: Planning ontvangt SpeakersRequested van Frontend — alle sprekers terugsturen

  receiveFrontendSessionCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.created'
    summary: Planning ontvangt SessionCreated van Frontend — sessie aanmaken

  receiveFrontendSessionUpdated:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.updated'
    summary: Planning ontvangt SessionUpdated van Frontend — sessie wijzigen

  receiveFrontendSessionCancelled:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.cancelled'
    summary: Planning ontvangt SessionCancelled van Frontend — sessie annuleren

  receiveFrontendSessionsRequested:
    action: receive
    channel:
      $ref: '#/channels/frontend.sessions.requested'
    summary: Planning ontvangt SessionsRequested van Frontend — alle sessies terugsturen

  receiveFrontendRegistrationCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.registration.created'
    summary: Planning ontvangt RegistrationCreated van Frontend — deelnemer registreren voor sessie

  # ── PLANNING ontvangt van CRM ────────────────────────────────────────
  receiveUserConfirmed:
    action: receive
    channel:
      $ref: '#/channels/crm.user.confirmed'
    summary: Planning ontvangt UserConfirmed van CRM — opslaan als Speaker, User of Participant

  receiveUserUpdated:
    action: receive
    channel:
      $ref: '#/channels/crm.user.updated'
    summary: Planning ontvangt UserUpdated van CRM — Speaker tabel bijwerken

  receiveUserDeactivated:
    action: receive
    channel:
      $ref: '#/channels/crm.user.deactivated'
    summary: Planning ontvangt UserDeactivated van CRM — isActive op false zetten

components:

  securitySchemes:
    rabbitmqAuth:
      type: userPassword
      description: RabbitMQ guest/guest voor lokale development — vervangen bij productie

  messages:

    Heartbeat:
      name: Heartbeat
      title: Heartbeat
      summary: Health check van de Planning Service — elke seconde
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/Heartbeat'

    SessionCreated:
      name: SessionCreated
      title: SessionCreated
      summary: Nieuwe sessie aangemaakt
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionCreated'

    SessionUpdated:
      name: SessionUpdated
      title: SessionUpdated
      summary: Sessie gewijzigd
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionUpdated'

    SessionCancelled:
      name: SessionCancelled
      title: SessionCancelled
      summary: Sessie geannuleerd
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionCancelled'

    SessionRescheduled:
      name: SessionRescheduled
      title: SessionRescheduled
      summary: Sessie verzet naar ander tijdslot
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionRescheduled'

    SessionFull:
      name: SessionFull
      title: SessionFull
      summary: Sessie is volzet
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionFull'

    SessionError:
      name: SessionError
      title: SessionError
      summary: Fout in de Planning Service
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionError'

    ParticipantRegistered:
      name: ParticipantRegistered
      title: ParticipantRegistered
      summary: Deelnemer ingeschreven voor sessie
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/ParticipantRegistered'

    RegistrationCreated:
      name: RegistrationCreated
      title: RegistrationCreated
      summary: Frontend stuurt registratieverzoek naar Planning
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/RegistrationCreated'

    RegistrationConfirmed:
      name: RegistrationConfirmed
      title: RegistrationConfirmed
      summary: Planning bevestigt registratie aan Frontend
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/RegistrationConfirmed'

    LocationCreated:
      name: LocationCreated
      title: LocationCreated
      summary: Locatie aangemaakt
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationCreated'

    LocationUpdated:
      name: LocationUpdated
      title: LocationUpdated
      summary: Locatie gewijzigd
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationUpdated'

    LocationDeleted:
      name: LocationDeleted
      title: LocationDeleted
      summary: Locatie verwijderd
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationDeleted'

    LocationsRequested:
      name: LocationsRequested
      title: LocationsRequested
      summary: Frontend vraagt alle locaties op
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationsRequested'

    SpeakerCreated:
      name: SpeakerCreated
      title: SpeakerCreated
      summary: Spreker aangemaakt
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakerCreated'

    SpeakerUpdated:
      name: SpeakerUpdated
      title: SpeakerUpdated
      summary: Spreker gewijzigd
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakerUpdated'

    SpeakerDeactivated:
      name: SpeakerDeactivated
      title: SpeakerDeactivated
      summary: Spreker gedeactiveerd
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakerDeactivated'

    SpeakersRequested:
      name: SpeakersRequested
      title: SpeakersRequested
      summary: Frontend vraagt alle sprekers op
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakersRequested'

    FrontendSessionCreated:
      name: FrontendSessionCreated
      title: FrontendSessionCreated
      summary: Frontend stuurt verzoek om sessie aan te maken
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSessionCreated'

    FrontendSessionUpdated:
