asyncapi: 3.1.0

info:
  title: Planning Service AsyncAPI
  version: 1.7.0
  description: AsyncAPI documentatie voor RabbitMQ messaging van de Planning Service.

defaultContentType: application/xml

servers:
  rabbitmq:
    host: rabbitmq:5672
    protocol: amqp
    description: RabbitMQ broker

channels:
  routing.heartbeat:
    address: routing.heartbeat
    messages:
      Heartbeat:
        $ref: '#/components/messages/Heartbeat'

  routing.statuscheck:
    address: routing.statuscheck
    messages:
      StatusCheck:
        $ref: '#/components/messages/StatusCheck'

  planning.session.created:
    address: planning.session.created
    messages:
      SessionCreated:
        $ref: '#/components/messages/SessionCreated'

  planning.session.updated:
    address: planning.session.updated
    messages:
      SessionUpdated:
        $ref: '#/components/messages/SessionUpdated'

  planning.session.cancelled:
    address: planning.session.cancelled
    messages:
      SessionCancelled:
        $ref: '#/components/messages/SessionCancelled'

  planning.session.rescheduled:
    address: planning.session.rescheduled
    messages:
      SessionRescheduled:
        $ref: '#/components/messages/SessionRescheduled'

  planning.session.full:
    address: planning.session.full
    messages:
      SessionFull:
        $ref: '#/components/messages/SessionFull'

  planning.participant.registered:
    address: planning.participant.registered
    messages:
      ParticipantRegistered:
        $ref: '#/components/messages/ParticipantRegistered'

  planning.session.error:
    address: planning.session.error
    messages:
      SessionError:
        $ref: '#/components/messages/SessionError'

  planning.location.created:
    address: planning.location.created
    messages:
      LocationCreated:
        $ref: '#/components/messages/LocationCreated'

  planning.location.updated:
    address: planning.location.updated
    messages:
      LocationUpdated:
        $ref: '#/components/messages/LocationUpdated'

  planning.location.deleted:
    address: planning.location.deleted
    messages:
      LocationDeleted:
        $ref: '#/components/messages/LocationDeleted'

  planning.speaker.created:
    address: planning.speaker.created
    messages:
      SpeakerCreated:
        $ref: '#/components/messages/SpeakerCreated'

  planning.speaker.updated:
    address: planning.speaker.updated
    messages:
      SpeakerUpdated:
        $ref: '#/components/messages/SpeakerUpdated'

  planning.speaker.deactivated:
    address: planning.speaker.deactivated
    messages:
      SpeakerDeactivated:
        $ref: '#/components/messages/SpeakerDeactivated'

  planning.registration.confirmed:
    address: planning.registration.confirmed
    messages:
      RegistrationConfirmed:
        $ref: '#/components/messages/RegistrationConfirmed'

  planning.user.created:
    address: planning.user.created
    messages:
      PlanningUserCreated:
        $ref: '#/components/messages/PlanningUserCreated'

  planning.user.updated:
    address: planning.user.updated
    messages:
      PlanningUserUpdated:
        $ref: '#/components/messages/PlanningUserUpdated'

  planning.user.deactivated:
    address: planning.user.deactivated
    messages:
      PlanningUserDeactivated:
        $ref: '#/components/messages/PlanningUserDeactivated'

  crm.user.confirmed:
    address: crm.user.confirmed
    messages:
      UserConfirmed:
        $ref: '#/components/messages/UserConfirmed'

  crm.user.updated:
    address: crm.user.updated
    messages:
      UserUpdated:
        $ref: '#/components/messages/UserUpdated'

  crm.user.deactivated:
    address: crm.user.deactivated
    messages:
      UserDeactivated:
        $ref: '#/components/messages/UserDeactivated'

  frontend.location.created:
    address: frontend.location.created
    messages:
      FrontendLocationCreated:
        $ref: '#/components/messages/FrontendLocationCreated'

  frontend.location.updated:
    address: frontend.location.updated
    messages:
      FrontendLocationUpdated:
        $ref: '#/components/messages/FrontendLocationUpdated'

  frontend.location.deleted:
    address: frontend.location.deleted
    messages:
      FrontendLocationDeleted:
        $ref: '#/components/messages/FrontendLocationDeleted'

  frontend.speaker.created:
    address: frontend.speaker.created
    messages:
      FrontendSpeakerCreated:
        $ref: '#/components/messages/FrontendSpeakerCreated'

  frontend.speaker.updated:
    address: frontend.speaker.updated
    messages:
      FrontendSpeakerUpdated:
        $ref: '#/components/messages/FrontendSpeakerUpdated'

  frontend.speaker.deactivated:
    address: frontend.speaker.deactivated
    messages:
      FrontendSpeakerDeactivated:
        $ref: '#/components/messages/FrontendSpeakerDeactivated'

  frontend.session.created:
    address: frontend.session.created
    messages:
      FrontendSessionCreated:
        $ref: '#/components/messages/FrontendSessionCreated'

  frontend.session.updated:
    address: frontend.session.updated
    messages:
      FrontendSessionUpdated:
        $ref: '#/components/messages/FrontendSessionUpdated'

  frontend.session.cancelled:
    address: frontend.session.cancelled
    messages:
      FrontendSessionCancelled:
        $ref: '#/components/messages/FrontendSessionCancelled'

  frontend.session.rescheduled:
    address: frontend.session.rescheduled
    messages:
      FrontendSessionRescheduled:
        $ref: '#/components/messages/FrontendSessionRescheduled'

  frontend.registration.created:
    address: frontend.registration.created
    messages:
      RegistrationCreated:
        $ref: '#/components/messages/RegistrationCreated'

operations:
  sendHeartbeat:
    action: send
    channel:
      $ref: '#/channels/routing.heartbeat'

  sendStatusCheck:
    action: send
    channel:
      $ref: '#/channels/routing.statuscheck'

  sendSessionCreated:
    action: send
    channel:
      $ref: '#/channels/planning.session.created'

  sendSessionUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.session.updated'

  sendSessionCancelled:
    action: send
    channel:
      $ref: '#/channels/planning.session.cancelled'

  sendSessionRescheduled:
    action: send
    channel:
      $ref: '#/channels/planning.session.rescheduled'

  sendSessionFull:
    action: send
    channel:
      $ref: '#/channels/planning.session.full'

  sendParticipantRegistered:
    action: send
    channel:
      $ref: '#/channels/planning.participant.registered'

  sendSessionError:
    action: send
    channel:
      $ref: '#/channels/planning.session.error'

  sendLocationCreated:
    action: send
    channel:
      $ref: '#/channels/planning.location.created'

  sendLocationUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.location.updated'

  sendLocationDeleted:
    action: send
    channel:
      $ref: '#/channels/planning.location.deleted'

  sendSpeakerCreated:
    action: send
    channel:
      $ref: '#/channels/planning.speaker.created'

  sendSpeakerUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.speaker.updated'

  sendSpeakerDeactivated:
    action: send
    channel:
      $ref: '#/channels/planning.speaker.deactivated'

  sendRegistrationConfirmed:
    action: send
    channel:
      $ref: '#/channels/planning.registration.confirmed'

  sendPlanningUserCreated:
    action: send
    channel:
      $ref: '#/channels/planning.user.created'

  sendPlanningUserUpdated:
    action: send
    channel:
      $ref: '#/channels/planning.user.updated'

  sendPlanningUserDeactivated:
    action: send
    channel:
      $ref: '#/channels/planning.user.deactivated'

  receiveCrmUserConfirmed:
    action: receive
    channel:
      $ref: '#/channels/crm.user.confirmed'

  receiveCrmUserUpdated:
    action: receive
    channel:
      $ref: '#/channels/crm.user.updated'

  receiveCrmUserDeactivated:
    action: receive
    channel:
      $ref: '#/channels/crm.user.deactivated'

  receiveFrontendLocationCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.location.created'

  receiveFrontendLocationUpdated:
    action: receive
    channel:
      $ref: '#/channels/frontend.location.updated'

  receiveFrontendLocationDeleted:
    action: receive
    channel:
      $ref: '#/channels/frontend.location.deleted'

  receiveFrontendSpeakerCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.speaker.created'

  receiveFrontendSpeakerUpdated:
    action: receive
    channel:
      $ref: '#/channels/frontend.speaker.updated'

  receiveFrontendSpeakerDeactivated:
    action: receive
    channel:
      $ref: '#/channels/frontend.speaker.deactivated'

  receiveFrontendSessionCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.created'

  receiveFrontendSessionUpdated:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.updated'

  receiveFrontendSessionCancelled:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.cancelled'

  receiveFrontendSessionRescheduled:
    action: receive
    channel:
      $ref: '#/channels/frontend.session.rescheduled'

  receiveFrontendRegistrationCreated:
    action: receive
    channel:
      $ref: '#/channels/frontend.registration.created'

components:
  messages:
    Heartbeat:
      name: Heartbeat
      title: Heartbeat
      contentType: application/xml
      payload:
        type: object
        required:
          - serviceId
          - timestamp
        properties:
          serviceId:
            type: string
            example: planning
          timestamp:
            type: string
            format: date-time

    StatusCheck:
      name: StatusCheck
      title: StatusCheck
      contentType: application/xml
      payload:
        type: object
        required:
          - serviceId
          - timestamp
          - uptime
          - memory
          - disk
        properties:
          serviceId:
            type: string
            example: planning
          timestamp:
            type: string
            format: date-time
          uptime:
            type: integer
            minimum: 0
          memory:
            type: number
          disk:
            type: number

    SessionCreated:
      name: SessionCreated
      title: Session created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionCreatedPayload'

    SessionUpdated:
      name: SessionUpdated
      title: Session updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionUpdatedPayload'

    SessionCancelled:
      name: SessionCancelled
      title: Session cancelled
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionCancelledPayload'

    SessionRescheduled:
      name: SessionRescheduled
      title: Session rescheduled
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionRescheduledPayload'

    SessionFull:
      name: SessionFull
      title: Session full
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionFullPayload'

    ParticipantRegistered:
      name: ParticipantRegistered
      title: Participant registered
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/ParticipantRegisteredPayload'

    SessionError:
      name: SessionError
      title: Session error
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SessionErrorPayload'

    LocationCreated:
      name: LocationCreated
      title: Location created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationPayload'

    LocationUpdated:
      name: LocationUpdated
      title: Location updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationPayload'

    LocationDeleted:
      name: LocationDeleted
      title: Location deleted
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/LocationDeletedPayload'

    SpeakerCreated:
      name: SpeakerCreated
      title: Speaker created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakerPayload'

    SpeakerUpdated:
      name: SpeakerUpdated
      title: Speaker updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakerPayload'

    SpeakerDeactivated:
      name: SpeakerDeactivated
      title: Speaker deactivated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/SpeakerDeactivatedPayload'

    RegistrationConfirmed:
      name: RegistrationConfirmed
      title: Registration confirmed
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/RegistrationConfirmedPayload'

    PlanningUserCreated:
      name: PlanningUserCreated
      title: Planning user created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/PlanningUserPayload'

    PlanningUserUpdated:
      name: PlanningUserUpdated
      title: Planning user updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/PlanningUserPayload'

    PlanningUserDeactivated:
      name: PlanningUserDeactivated
      title: Planning user deactivated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/PlanningUserDeactivatedPayload'

    UserConfirmed:
      name: UserConfirmed
      title: CRM user confirmed
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/CrmUserConfirmedPayload'

    UserUpdated:
      name: UserUpdated
      title: CRM user updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/CrmUserUpdatedPayload'

    UserDeactivated:
      name: UserDeactivated
      title: CRM user deactivated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/CrmUserDeactivatedPayload'

    FrontendLocationCreated:
      name: FrontendLocationCreated
      title: Frontend location created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendLocationCreatedPayload'

    FrontendLocationUpdated:
      name: FrontendLocationUpdated
      title: Frontend location updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendLocationUpdatedPayload'

    FrontendLocationDeleted:
      name: FrontendLocationDeleted
      title: Frontend location deleted
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendLocationDeletedPayload'

    FrontendSpeakerCreated:
      name: FrontendSpeakerCreated
      title: Frontend speaker created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSpeakerCreatedPayload'

    FrontendSpeakerUpdated:
      name: FrontendSpeakerUpdated
      title: Frontend speaker updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSpeakerUpdatedPayload'

    FrontendSpeakerDeactivated:
      name: FrontendSpeakerDeactivated
      title: Frontend speaker deactivated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSpeakerDeactivatedPayload'

    FrontendSessionCreated:
      name: FrontendSessionCreated
      title: Frontend session created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSessionCreatedPayload'

    FrontendSessionUpdated:
      name: FrontendSessionUpdated
      title: Frontend session updated
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSessionUpdatedPayload'

    FrontendSessionCancelled:
      name: FrontendSessionCancelled
      title: Frontend session cancelled
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSessionCancelledPayload'

    FrontendSessionRescheduled:
      name: FrontendSessionRescheduled
      title: Frontend session rescheduled
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/FrontendSessionRescheduledPayload'

    RegistrationCreated:
      name: RegistrationCreated
      title: Frontend registration created
      contentType: application/xml
      payload:
        $ref: '#/components/schemas/RegistrationCreatedPayload'

  schemas:
    SessionCreatedPayload:
      type: object
      required:
        - title
        - date
        - startTime
      properties:
        sessionId:
          type: string
        title:
          type: string
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        location:
          type: string
        locationId:
          type: string
        status:
          type: string
          enum:
            - active
            - cancelled
            - full
            - concept
            - inactive
        capacity:
          type: integer
        icsData:
          type: string
          description: Base64 encoded ICS calendar file.
        timestamp:
          type: string
          format: date-time

    SessionUpdatedPayload:
      type: object
      required:
        - sessionId
        - sessionName
        - changeType
      properties:
        sessionId:
          type: string
        sessionName:
          type: string
        changeType:
          type: string
          enum:
            - updated
            - rescheduled
            - cancelled
            - locationChanged
            - timeChanged
        newTime:
          type: string
        newLocation:
          type: string
        participantIds:
          type: array
          items:
            type: string
        icsData:
          type: string
        timestamp:
          type: string
          format: date-time

    SessionCancelledPayload:
      type: object
      required:
        - sessionId
        - sessionName
      properties:
        sessionId:
          type: string
        sessionName:
          type: string
        status:
          type: string
          example: cancelled
        reason:
          type: string
        participantIds:
          type: array
          items:
            type: string
        icsData:
          type: string
        timestamp:
          type: string
          format: date-time

    SessionRescheduledPayload:
      type: object
      required:
        - sessionId
        - sessionName
        - oldDate
        - oldStartTime
        - newDate
        - newStartTime
      properties:
        sessionId:
          type: string
        sessionName:
          type: string
        oldDate:
          type: string
        oldStartTime:
          type: string
        oldEndTime:
          type: string
        newDate:
          type: string
        newStartTime:
          type: string
        newEndTime:
          type: string
        newLocation:
          type: string
        reason:
          type: string
        participantIds:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        icsData:
          type: string

    SessionFullPayload:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
        currentRegistrations:
          type: integer
        capacity:
          type: integer
        crmMasterId:
          type: string
        timestamp:
          type: string
          format: date-time

    ParticipantRegisteredPayload:
      type: object
      required:
        - sessionId
        - currentRegistrations
      properties:
        sessionId:
          type: string
        crmMasterId:
          type: string
        currentRegistrations:
          type: integer
        capacity:
          type: integer
        registrationTime:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time

    SessionErrorPayload:
      type: object
      required:
        - errorType
        - message
        - timestamp
      properties:
        errorType:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    LocationPayload:
      type: object
      required:
        - locationId
        - roomName
        - capacity
      properties:
        locationId:
          type: string
        roomName:
          type: string
        capacity:
          type: integer
        address:
          type: string
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    LocationDeletedPayload:
      type: object
      required:
        - locationId
      properties:
        locationId:
          type: string
        timestamp:
          type: string
          format: date-time

    SpeakerPayload:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        speakerId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        company:
          type: string
        isActive:
          type: boolean
        timestamp:
          type: string
          format: date-time

    SpeakerDeactivatedPayload:
      type: object
      required:
        - speakerId
      properties:
        speakerId:
          type: string
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    RegistrationConfirmedPayload:
      type: object
      required:
        - registrationId
        - sessionId
        - crmMasterId
      properties:
        registrationId:
          type: string
        sessionId:
          type: string
        crmMasterId:
          type: string
        timestamp:
          type: string
          format: date-time

    PlanningUserPayload:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        phoneNumber:
          type: string
        company:
          type: string

    PlanningUserDeactivatedPayload:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    CrmUserConfirmedPayload:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - confirmedAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
        companyId:
          type: string
        badgeCode:
          type: string
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
        confirmedAt:
          type: string
          format: date-time

    CrmUserUpdatedPayload:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - updatedAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        street:
          type: string
        houseNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
        role:
          type: string
        companyId:
          type: string
        badgeCode:
          type: string
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    CrmUserDeactivatedPayload:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    FrontendLocationCreatedPayload:
      type: object
      required:
        - roomName
        - capacity
      properties:
        roomName:
          type: string
        capacity:
          type: integer
          minimum: 1
        address:
          type: string

    FrontendLocationUpdatedPayload:
      type: object
      required:
        - locationId
        - roomName
        - capacity
        - status
      properties:
        locationId:
          type: string
        roomName:
          type: string
        capacity:
          type: integer
          minimum: 1
        address:
          type: string
        status:
          type: string

    FrontendLocationDeletedPayload:
      type: object
      required:
        - locationId
      properties:
        locationId:
          type: string

    FrontendSpeakerCreatedPayload:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        company:
          type: string

    FrontendSpeakerUpdatedPayload:
      type: object
      required:
        - speakerId
        - firstName
        - lastName
        - email
      properties:
        speakerId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        company:
          type: string

    FrontendSpeakerDeactivatedPayload:
      type: object
      required:
        - speakerId
      properties:
        speakerId:
          type: string

    FrontendSessionCreatedPayload:
      type: object
      required:
        - title
        - date
        - startTime
        - endTime
        - capacity
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        capacity:
          type: integer
          minimum: 1
        locationId:
          type: string
        speakerId:
          type: string

    FrontendSessionUpdatedPayload:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
        title:
          type: string
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
